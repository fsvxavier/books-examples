# Serviços do Livro 1 (capítulo 20, bancos de dados). Tudo preso a 127.0.0.1.
name: golivro1
services:
  postgres:
    image: postgres:18-alpine
    container_name: golivro-pg
    environment:
      POSTGRES_USER: livro
      POSTGRES_PASSWORD: livro
      POSTGRES_DB: livro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livro -d livro"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:9
    container_name: golivro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: livro
      MYSQL_DATABASE: livro
      MYSQL_USER: livro
      MYSQL_PASSWORD: livro
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulivro -plivro --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: golivro-mongo
    ports:
      - "127.0.0.1:57017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:latest
    container_name: golivro-valkey
    ports:
      - "127.0.0.1:56390:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
